allowBuilds:
  esbuild: true

# サプライチェーン攻撃への防御。公開直後のパッケージは、乗っ取られたアカウントからの publish が
# 発覚・取り下げされる前かもしれないので、公開から 3 日（4320 分）経ったものだけを取り込む。
# minimumReleaseAgeExclude は置かない。恒久的な穴を開けるより、急ぎの脆弱性修正が要るときだけ
# この値を一時的に下げるか overrides で当該バージョンを固定する方が安全なため。
# Dependabot はこの設定を読まないので、同じ猶予を .github/dependabot.yml の cooldown にも書く。
minimumReleaseAge: 4320

# デプロイツールが固定する脆弱な間接依存を修正版に揃える。
overrides:
  '@esbuild-kit/core-utils>esbuild': 0.25.12
  '@tootallnate/once@<2.0.1': 2.0.1
  'ajv@>=8 <8.20.0': 8.20.0
  'js-yaml@>=4 <4.3.2': 4.3.2
  'minimatch@>=10 <10.2.6': 10.2.6
  'path-to-regexp@>=6 <6.3.0': 6.3.0
  'path-to-regexp@>=8 <8.4.2': 8.4.2
  'smol-toml@<1.8.0': 1.8.0
  'tar@>=7 <7.5.22': 7.5.22
  'undici@>=5 <6.28.1': 6.28.1
