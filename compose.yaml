# ローカル開発・テスト用の Postgres。`pnpm dev` / `pnpm test` / `pnpm e2e` はこのDBを前提とする。
services:
  postgres:
    # 本番（Neon、infra/neon.tf の pg_version）と同じメジャーバージョン。本番のダンプ（pnpm db:dump）を戻せるように揃える
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lifehub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
