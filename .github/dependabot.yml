version: 2

updates:
  # pnpm の依存（package.json / pnpm-lock.yaml）。pnpm は npm エコシステムとして扱われる。
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # ラベルを付けない。PR を開いた直後に付くラベルが CI（ci.yml の labeled）をもう一度走らせ、
    # 最初の実行を取り消させるため。ラベルはどこでも使っていない。
    labels: []

    # pnpm-workspace.yaml の minimumReleaseAge と同じ 3 日の猶予。Dependabot は pnpm の設定を
    # 読まない独立した解決系なので、同じ制限をこちらにも書く。GitHub のデフォルトも現状 3 日だが、
    # 依存の取り込み基準をデフォルト任せにしないよう明示する。
    # security updates（脆弱性修正の PR）は Dependabot の仕様で cooldown の対象外になる。
    cooldown:
      default-days: 3

    # 更新をまとめて 1 つの PR にする。PR を分けると、そのたびに CI が走り、人が見てマージする
    # 手間も増えるため。まとめても個々の変更はロックファイルの差分で追える。
    groups:
      npm:
        patterns:
          - '*'

  # GitHub Actions（uses は SHA で固定。docs/development.md）。猶予とまとめ方は npm と同じ理由。
  # Action の更新は npm より少ないので月次にし、CI の実行回数を増やしすぎない。
  - package-ecosystem: github-actions
    # / は .github/workflows を指す。ローカルの合成 Action の中の uses は別に指定しないと見ない。
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: monthly
    labels: []
    cooldown:
      default-days: 3
    groups:
      # メジャー更新はまとめない。Action のメジャー更新は動作が変わる（実行する Node の版、
      # 既定値など）ことがあり、CI が落ちたときにどの Action が原因かを切り分けられるよう 1 つずつ出す。
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

# Terraform は対象にしない。プロバイダ更新はリソース再作成の事故を避けるため、バージョン制約を
# 編集する PR で行う（docs/development.md）。
