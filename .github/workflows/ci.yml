name: CI

on:
  pull_request:
    # labeled は preview ラベルを付けた瞬間に Preview デプロイを始めるために要る。
    # types を書くと既定値が消えるので、既定の 3 つも並べて書く。
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write


jobs:
  check:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    services:
      postgres:
        # 本番（Neon、infra/neon.tf の pg_version）と同じメジャーバージョン
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lifehub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm db:migrate
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          CI: "1"
      # 落ちたテストのトレース（playwright.config.ts の trace: 'retain-on-failure'）。
      # CI の reporter は github なので playwright-report は作られず、トレースは test-results に残る
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # 秘密情報（API キー・トークンなど）がコミットに入っていないかを調べる。public リポジトリなので、
  # 入ってしまうと履歴から消しても見られた前提で失効させるしかない。マージ前に止める。
  # PR のコミットを全部読むので全履歴を取る。GITHUB_TOKEN は PR のコミット一覧を取るのと、
  # 見つけた行に注釈を付けるのに使う（個人アカウントのリポジトリなのでライセンスキーは要らない）。
  # push はしないので、checkout のトークンを .git/config に残さない。
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependabot の PR では動かさない。Dependabot が起こした実行には Actions の secrets が渡らず、
  # init の時点で必ず落ちる。依存の更新は infra/ を変えないので plan を見る意味も無い。
  # WHY NOT Dependabot secrets に同じ値を登録: すべての秘密を 2 か所で管理することになる。
  # 下の preview はこのジョブに依存するので、一緒に飛ばされる。
  terraform:
    name: terraform plan
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      # main への最初のデプロイ（terraform apply）が済んでいるか。済むまで preview は作れない
      applied: ${{ steps.state.outputs.applied }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-terraform
      - run: terraform -chdir=infra fmt -check
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - run: terraform -chdir=infra validate
      - id: state
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          if terraform -chdir=infra output -raw vercel_project_id >/dev/null 2>&1; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi
      - id: plan
        # 明示的な bash は pipefail 付きなので、tee を挟んでも terraform の失敗がジョブの失敗になる
        shell: bash
        run: terraform -chdir=infra plan -no-color -input=false -out=tfplan | tee plan.txt
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_neon_org_id: ${{ secrets.TF_VAR_neon_org_id }}
          TF_VAR_vercel_team: ${{ secrets.TF_VAR_vercel_team }}
          TF_VAR_qstash_token: ${{ secrets.TF_VAR_qstash_token }}
          TF_VAR_qstash_current_signing_key: ${{ secrets.TF_VAR_qstash_current_signing_key }}
          TF_VAR_qstash_next_signing_key: ${{ secrets.TF_VAR_qstash_next_signing_key }}
          TF_VAR_vapid_public_key: ${{ secrets.TF_VAR_vapid_public_key }}
          TF_VAR_vapid_private_key: ${{ secrets.TF_VAR_vapid_private_key }}
          TF_VAR_moneyforward_email: ${{ secrets.TF_VAR_moneyforward_email }}
          TF_VAR_moneyforward_password: ${{ secrets.TF_VAR_moneyforward_password }}
          TF_VAR_moneyforward_totp_secret: ${{ secrets.TF_VAR_moneyforward_totp_secret }}
          TF_VAR_moneyforward_group: ${{ secrets.TF_VAR_moneyforward_group }}
          TF_VAR_moneyforward_accounts: ${{ secrets.TF_VAR_moneyforward_accounts }}
      - name: Comment plan on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: terraform-plan
          path: plan.txt

  preview:
    name: preview deploy
    needs: [check, terraform]
    # preview ラベルの付いた PR だけをデプロイする。Vercel の 1 日あたりのデプロイ数上限に
    # 当たったため、Preview が要る PR をラベルで明示してもらう。ラベルが付いていれば
    # ラベルを付けたとき・push したとき・PR を開き直したときにデプロイする。関係ない
    # ラベルを付け外ししただけのときは、同じ内容を作り直すだけなので何もしない。
    # 初回の apply 前（Vercel / Neon のプロジェクトが無い）も preview を作れない。
    if: >-
      needs.terraform.outputs.applied == 'true'
      && contains(github.event.pull_request.labels.*.name, 'preview')
      && (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-terraform
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - name: Read terraform outputs
        id: tf
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          echo "vercel_org_id=$(terraform -chdir=infra output -raw vercel_org_id)" >> "$GITHUB_OUTPUT"
          echo "vercel_project_id=$(terraform -chdir=infra output -raw vercel_project_id)" >> "$GITHUB_OUTPUT"
          echo "neon_project_id=$(terraform -chdir=infra output -raw neon_project_id)" >> "$GITHUB_OUTPUT"
      - name: Create Neon preview branch
        id: neon
        uses: neondatabase/create-branch-action@fb620d43d4c565abaf088b848a4e28e5c4ea4d9c # 6.3.1
        with:
          project_id: ${{ steps.tf.outputs.neon_project_id }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
          database: lifehub
          role: lifehub
      - name: Migrate preview branch
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
      - run: pnpm exec vercel pull --yes --environment=preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      # build はアプリのビルド（依存パッケージのコード）を動かすので、トークンを渡さない
      - run: pnpm exec vercel build
        env:
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      - id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
          DATABASE_URL: ${{ steps.neon.outputs.db_url_pooled }}
        run: |
          url=$(pnpm exec vercel deploy --prebuilt --env DATABASE_URL="$DATABASE_URL")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: preview
          message: |
            **Preview:** ${{ steps.deploy.outputs.url }}
            **Neon branch:** `preview/pr-${{ github.event.pull_request.number }}`
