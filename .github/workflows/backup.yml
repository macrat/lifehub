name: Backup

on:
  schedule:
    # 毎日 JST 4:00（UTC 19:00）。使う人が寝ていて書き込みが無い時間帯に取る。
    # GitHub の schedule は混雑時に遅れることがあるが、明け方のうちに済めばよい。
    - cron: "0 19 * * *"
  # 手動でも取れるようにする（マイグレーションの前など）
  workflow_dispatch:

concurrency:
  group: backup
  cancel-in-progress: false

permissions:
  contents: read

# 本番 DB のまるごとのダンプと全予定の ics を暗号化して Artifact に置く。何をなぜ残すかと、
# なぜ暗号化するかは docs/operations.md の「バックアップ」を参照。
#
# クレデンシャルは、それを使うステップの env にだけ置く（deploy.yml と同じ方針）。
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # ランナーに入っている Postgres クライアントは本番（Neon、infra/neon.tf の pg_version）より
      # 古く、古い pg_dump は新しいサーバーを読めない。PGDG の公式手順で同じ版を入れて PATH の先頭に置く
      # （/usr/bin/pg_dump は版を選ぶラッパーで、どの版を使うかが環境で変わるため直接指す）。
      - name: Install PostgreSQL client
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-terraform
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - name: Read terraform outputs
        id: tf
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          database_url=$(terraform -chdir=infra output -raw database_url)
          echo "::add-mask::$database_url"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"
      - name: Name the backup
        id: name
        run: echo "name=backup-$(TZ=Asia/Tokyo date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Dump
        run: |
          mkdir backup
          pnpm db:dump backup/lifehub.sql
          pnpm calendar:export backup/lifehub.ics
        env:
          DATABASE_URL: ${{ steps.tf.outputs.database_url }}
          # サーバーの環境変数の検証（server/lib/env.ts）を通すためだけの値。ics の書き出しは認証を使わない
          BETTER_AUTH_SECRET: unused-for-export-but-required-by-env-validation
      # 鍵はキーリングに取り込まずにファイルから直接使う（--recipient-file）。ランナーの GnuPG に
      # 信用の設定をせずに済む。
      - name: Encrypt
        run: gpg --batch --recipient-file .github/backup-key.asc --encrypt-files backup/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.name.outputs.name }}
          # 平文を消すのではなく、暗号化した物だけを選んで上げる。backup/ に何が増えても平文は出ない
          path: backup/*.gpg
          if-no-files-found: error
          # gpg が暗号化の前に圧縮している。暗号文はそれ以上縮まない
          compression-level: 0
          retention-days: 30
