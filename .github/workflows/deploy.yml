name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# クレデンシャルは、それを使うステップの env にだけ置く。ワークフローやジョブの env に
# 置くと、依存パッケージのコードが動く pnpm install や vercel build を含む全ステップに
# 渡ってしまう。Terraform の出力も GITHUB_ENV ではなくステップの出力にして、使う
# ステップにだけ渡す。
jobs:
  deploy:
    name: terraform apply → migrate → deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-terraform
      # プロバイダの更新はバージョン制約を編集する PR で行うため -upgrade は付けない（Neon のリソース再作成事故を防ぐ）
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - run: terraform -chdir=infra apply -auto-approve -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_sentry_auth_token: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TF_VAR_neon_org_id: ${{ secrets.TF_VAR_neon_org_id }}
          TF_VAR_vercel_team: ${{ secrets.TF_VAR_vercel_team }}
          TF_VAR_qstash_token: ${{ secrets.TF_VAR_qstash_token }}
          TF_VAR_qstash_current_signing_key: ${{ secrets.TF_VAR_qstash_current_signing_key }}
          TF_VAR_qstash_next_signing_key: ${{ secrets.TF_VAR_qstash_next_signing_key }}
          TF_VAR_vapid_public_key: ${{ secrets.TF_VAR_vapid_public_key }}
          TF_VAR_vapid_private_key: ${{ secrets.TF_VAR_vapid_private_key }}
          TF_VAR_moneyforward_email: ${{ secrets.TF_VAR_moneyforward_email }}
          TF_VAR_moneyforward_password: ${{ secrets.TF_VAR_moneyforward_password }}
          TF_VAR_moneyforward_totp_secret: ${{ secrets.TF_VAR_moneyforward_totp_secret }}
          TF_VAR_moneyforward_group: ${{ secrets.TF_VAR_moneyforward_group }}
          TF_VAR_moneyforward_accounts: ${{ secrets.TF_VAR_moneyforward_accounts }}
      - name: Read terraform outputs
        id: tf
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          echo "vercel_org_id=$(terraform -chdir=infra output -raw vercel_org_id)" >> "$GITHUB_OUTPUT"
          echo "vercel_project_id=$(terraform -chdir=infra output -raw vercel_project_id)" >> "$GITHUB_OUTPUT"
          echo "sentry_organization=$(terraform -chdir=infra output -raw sentry_organization)" >> "$GITHUB_OUTPUT"
          echo "sentry_project=$(terraform -chdir=infra output -raw sentry_project)" >> "$GITHUB_OUTPUT"
          database_url=$(terraform -chdir=infra output -raw database_url)
          echo "::add-mask::$database_url"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.tf.outputs.database_url }}
      - run: pnpm exec vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      # build はアプリのビルド（依存パッケージのコード）を動かすので、トークンを渡さない。
      # pull 済みのプロジェクト設定だけで動く。
      - run: pnpm exec vercel build --prod
        env:
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      # ブラウザのエラーを元のソースの位置で読めるよう、ソースマップを Sentry に送る。ビルドした JS と
      # ソースマップの両方に同じ Debug ID を書き込み（inject）、Sentry はそれで対応を取る。
      # 送れなくてもエラーの収集は続き、スタックトレースが圧縮後の位置になるだけなので、デプロイは止めない。
      - name: Upload source maps to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ steps.tf.outputs.sentry_organization }}
          SENTRY_PROJECT: ${{ steps.tf.outputs.sentry_project }}
        run: |
          pnpm exec sentry-cli sourcemaps inject .vercel/output/static
          pnpm exec sentry-cli sourcemaps upload .vercel/output/static
      # ソースマップは公開しない（ビルドした JS からは参照していない。vite.config.ts の build.sourcemap）
      - name: Remove source maps
        run: find .vercel/output/static -name '*.map' -delete
      - run: pnpm exec vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      # Sentry のリリース（ビルドしたコミット。`build-info.ts` の __BUILD_COMMIT__）に、前のリリースからの
      # コミットを紐付ける。エラーがどのリリースで入ったかをコミットで追え、コミットメッセージの
      # `Fixes <Issue>` でそのリリースが出たときに Issue が解決済みになる。
      # --auto は Sentry の GitHub 連携に登録済みのリポジトリ（macrat/lifehub）を git の remote から見つけ、
      # 前のリリースからのコミットを連携経由で GitHub から取る。
      # WHY NOT --local: 手元の git から送るので、連携のリポジトリとは別の「origin」というリポジトリとして
      # 登録され、Sentry 上で同じリポジトリが 2 つに分かれる。
      # 送れなくてもエラーの収集は続くので、デプロイは止めない。
      - name: Associate commits with the Sentry release
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ steps.tf.outputs.sentry_organization }}
          SENTRY_PROJECT: ${{ steps.tf.outputs.sentry_project }}
        # リリースは先に届いたエラーで作られていることがあり（再実行でも）、そのとき new が失敗しても紐付けは試す
        run: |
          pnpm exec sentry-cli releases new "$GITHUB_SHA" || true
          pnpm exec sentry-cli releases set-commits "$GITHUB_SHA" --auto
          pnpm exec sentry-cli releases finalize "$GITHUB_SHA"
