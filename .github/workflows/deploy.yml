name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

# クレデンシャルは、それを使うステップの env にだけ置く。ワークフローやジョブの env に
# 置くと、依存パッケージのコードが動く pnpm install や vercel build を含む全ステップに
# 渡ってしまう。Terraform の出力も GITHUB_ENV ではなくステップの出力にして、使う
# ステップにだけ渡す。
jobs:
  deploy:
    name: terraform apply → migrate → deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      # プロバイダの更新は Renovate の PR で行うため -upgrade は付けない（Neon のリソース再作成事故を防ぐ）
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - run: terraform -chdir=infra apply -auto-approve -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TF_VAR_vercel_api_token: ${{ secrets.VERCEL_TOKEN }}
          TF_VAR_neon_api_key: ${{ secrets.NEON_API_KEY }}
          TF_VAR_neon_org_id: ${{ secrets.TF_VAR_neon_org_id }}
          TF_VAR_vercel_team: ${{ secrets.TF_VAR_vercel_team }}
          TF_VAR_qstash_token: ${{ secrets.TF_VAR_qstash_token }}
          TF_VAR_qstash_current_signing_key: ${{ secrets.TF_VAR_qstash_current_signing_key }}
          TF_VAR_qstash_next_signing_key: ${{ secrets.TF_VAR_qstash_next_signing_key }}
          TF_VAR_vapid_public_key: ${{ secrets.TF_VAR_vapid_public_key }}
          TF_VAR_vapid_private_key: ${{ secrets.TF_VAR_vapid_private_key }}
      - name: Read terraform outputs
        id: tf
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          echo "vercel_org_id=$(terraform -chdir=infra output -raw vercel_org_id)" >> "$GITHUB_OUTPUT"
          echo "vercel_project_id=$(terraform -chdir=infra output -raw vercel_project_id)" >> "$GITHUB_OUTPUT"
          database_url=$(terraform -chdir=infra output -raw database_url)
          echo "::add-mask::$database_url"
          echo "database_url=$database_url" >> "$GITHUB_OUTPUT"
      - run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ steps.tf.outputs.database_url }}
      - run: pnpm exec vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      # build はアプリのビルド（依存パッケージのコード）を動かすので、トークンを渡さない。
      # pull 済みのプロジェクト設定だけで動く。
      - run: pnpm exec vercel build --prod
        env:
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
      - run: pnpm exec vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ steps.tf.outputs.vercel_org_id }}
          VERCEL_PROJECT_ID: ${{ steps.tf.outputs.vercel_project_id }}
