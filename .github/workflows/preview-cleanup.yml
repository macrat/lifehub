name: Preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

env:
  NEON_BRANCH: preview/pr-${{ github.event.pull_request.number }}

# クレデンシャルは、それを使うステップの env にだけ置く（deploy.yml と同じ方針）。
#
# Preview は `preview` ラベルの付いた PR にしか作らないので、閉じた PR に消すものが無い
# ことがある（ラベルを付けなかった PR、初回 apply 前に閉じた PR）。そのときも失敗させず、
# 何もしないで終わる。判断はラベルではなく Neon ブランチの有無で行う。デプロイした後で
# ラベルを外して閉じた PR のブランチが残り、Free プランのブランチ数上限（10）に当たる
# ため。ブランチがあるのに消せないときは、直すべき異常なのでジョブを失敗させる。
jobs:
  delete-neon-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-terraform
      - run: terraform -chdir=infra init -input=false
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - name: Read terraform outputs
        id: tf
        # 初回 apply 前は Neon プロジェクトがまだ無く、出力も無い（空になる）
        run: echo "neon_project_id=$(terraform -chdir=infra output -raw neon_project_id 2>/dev/null)" >> "$GITHUB_OUTPUT"
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      - name: Find Neon preview branch
        id: branch
        if: steps.tf.outputs.neon_project_id != ''
        # 明示的な bash は pipefail 付きなので、curl の失敗がジョブの失敗になる
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ steps.tf.outputs.neon_project_id }}
        run: |
          id=$(curl -fsS -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches" \
            | jq -r --arg name "$NEON_BRANCH" '.branches[] | select(.name == $name) | .id')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      # WHY NOT neondatabase/delete-branch-action: 実行時に `npm i -g neonctl@v2` で最新の
      # neonctl を入れるので、SHA で固定しても NEON_API_KEY と同じ場所で動くコードが固定されない。
      # API を 1 回呼ぶだけなので curl で足りる。
      - name: Delete Neon preview branch
        if: steps.branch.outputs.id != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PROJECT_ID: ${{ steps.tf.outputs.neon_project_id }}
          BRANCH_ID: ${{ steps.branch.outputs.id }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$PROJECT_ID/branches/$BRANCH_ID" > /dev/null
